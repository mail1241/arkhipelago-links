<style>
  :root {
    --night: #07080c;
    --cream: #faf4e7;
    --dim: rgba(250,244,231,0.62);
    --line: rgba(250,244,231,0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--night);
    color: var(--cream);
    font-family: Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    min-height: 100svh;
  }
  .sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .sky .tw { animation: twinkle 6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sky .tw { animation: none; } }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 12vh 24px 40px;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }
  .socials {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 1.4rem;
  }
  .socials a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    color: var(--dim);
    transition: color 0.2s;
  }
  .socials a:hover { color: var(--cream); }
  .socials a:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
  h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    text-align: center;
    margin-right: -0.42em;
  }
  .tagline {
    margin-top: 0.9rem;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
  }
  ul { list-style: none; margin-top: 2rem; display: grid; gap: 14px; }
  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    padding: 0 20px;
    border: 0.5px solid var(--line);
    background: rgba(7,8,12,0.55);
    color: var(--cream);
    text-decoration: none;
    font-size: 0.72rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .link .row { display: flex; align-items: center; width: 150px; }
  .link .ib { width: 18px; margin-right: 14px; display: flex; justify-content: center; flex-shrink: 0; }
  .link:hover { background: var(--cream); color: var(--night); border-color: var(--cream); }
  .link:focus-visible { outline: 2px solid var(--cream); outline-offset: 4px; }
  footer {
    margin-top: auto;
    padding-top: 4rem;
    text-align: center;
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(250,244,231,0.4);
  }
</style>
